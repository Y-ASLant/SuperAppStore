# This workflow will install Python dependencies and build the application
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Nuitka Build

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  package:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install altgraph==0.17.4 requests>=2.32.4 darkdetect==0.8.0 packaging==25.0 pefile==2023.2.7 pyqt-fluent-widgets==1.8.3 pyqt5==5.15.11 pyqt5-frameless-window==0.7.3 pyqt5-qt5==5.15.2 pyqt5-sip==12.17.0 pywin32==310 pywin32-ctypes==0.2.3 setuptools==80.9.0 nuitka
    - name: Extract version from setting.py
      run: |
        $version = python -c "from app.common.setting import VERSION; print(VERSION)"
        echo "APP_VERSION=$version" >> $env:GITHUB_ENV
    - name: Build with Nuitka
      run: |
        python build.py
    - name: Install UPX
      run: |
        choco install upx -y
    - name: Compress with UPX
      run: |
        Write-Host "开始使用 UPX 极致压缩可执行文件..."
        $files = Get-ChildItem -Path "dist\main.dist" -Include *.exe,*.dll -Recurse
        $successCount = 0
        $failCount = 0
        foreach ($file in $files) {
          Write-Host "正在压缩: $($file.Name)"
          $output = upx --best --lzma $file.FullName 2>&1
          if ($LASTEXITCODE -eq 0) {
            $successCount++
            Write-Host "  ✓ 成功" -ForegroundColor Green
          } else {
            $failCount++
            Write-Host "  ✗ 跳过 (文件可能已压缩或不兼容)" -ForegroundColor Yellow
          }
        }
        Write-Host "`nUPX 压缩完成！成功: $successCount, 跳过: $failCount" -ForegroundColor Cyan
        exit 0
    - name: Setup Inno Setup
      run: |
        choco install innosetup -y
    - name: Create Inno Setup script
      run: |
        @"
        [Setup]
        AppName=SuperAppStore
        AppVersion=${{ env.APP_VERSION }}
        AppId={{36E4AA33-3464-48E9-A418-CDAE5D3CA041}}
        DefaultDirName={autopf}\SuperAppStore
        DefaultGroupName=SuperAppStore
        OutputBaseFilename=SuperAppStore_${{ env.APP_VERSION }}-Setup
        ; 优化压缩设置
        Compression=lzma2/ultra64
        SolidCompression=yes
        InternalCompressLevel=max
        WizardStyle=modern
        SetupIconFile=App.ico
        
        [Files]
        Source: "dist\main.dist\*"; DestDir: "{app}"; Flags: recursesubdirs
        
        [Icons]
        Name: "{group}\SuperAppStore"; Filename: "{app}\SuperAppStore.exe"
        Name: "{commondesktop}\SuperAppStore"; Filename: "{app}\SuperAppStore.exe"
        "@ | Out-File -FilePath "installer.iss" -Encoding utf8
    - name: Build installer
      run: |
        iscc installer.iss
    - name: Rename installer
      run: |
        Move-Item -Path "Output\SuperAppStore_${{ env.APP_VERSION }}-Setup.exe" -Destination "SuperAppStore_${{ env.APP_VERSION }}-Setup.exe"
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SuperAppStore-${{ env.APP_VERSION }}
        path: SuperAppStore_${{ env.APP_VERSION }}-Setup.exe
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: SuperAppStore_${{ env.APP_VERSION }}-Setup.exe
        draft: false
        prerelease: false
        token: ${{ secrets.MY_GITHUB_TOKEN }}
